<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All applications · Onward</title>
  <meta name="description" content="Onward — a personal job application tracker that tells you what to do next.">
  <!-- Apply the saved theme before the page paints (prevents a white flash in dark mode) -->
  <script>try{var s=JSON.parse(localStorage.getItem("jobtracker_settings"))||{};var d=s.theme==="dark"||(s.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-bs-theme",d?"dark":"light")}catch(e){}</script>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="applications">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <main id="main" class="container-xl pb-5">
    <div id="alerts"></div>

    <div class="page-header">
      <div>
        <h1 class="page-title">My applications</h1>
        <p class="page-sub" id="page-sub">Every opportunity in one place.</p>
      </div>
    </div>

    <!-- Search, filters and sorting -->
    <section class="toolbar" aria-label="Search and filters">
      <label class="form-label visually-hidden" for="search">Search</label>
      <div class="input-with-icon search-big" id="search-wrap">
        <input type="search" class="form-control" id="search" placeholder="Search by company, role or person…" autocomplete="off">
      </div>
      <div class="mt-3" role="group" aria-label="Filter by status">
        <div class="chip-row" id="status-chips"></div>
      </div>
      <div class="toolbar-selects">
        <div>
          <label class="form-label" for="filter-type">Job type</label>
          <select class="form-select" id="filter-type">
            <option value="">All types</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="filter-priority">Priority</label>
          <select class="form-select" id="filter-priority">
            <option value="">All priorities</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="sort">Sort by</label>
          <select class="form-select" id="sort"></select>
        </div>
      </div>
    </section>

    <div class="result-line">
      <span id="result-count" aria-live="polite"></span>
      <button type="button" class="btn btn-link btn-sm p-0 d-none" id="clear-filters">Clear all filters</button>
    </div>

    <!-- One card per application -->
    <div id="results"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/applications.js"></script>
  <script src="js/follow-ups.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/applications.js"></script>
</body>
</html>
